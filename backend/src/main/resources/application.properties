spring.application.name=evidence-vault-backend

# Application port
server.port=8081

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/evidence_vault}
spring.datasource.username=${MYSQL_USER:evidence_user}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT configuration
app.jwt.issuer=evidence-vault
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=30


# Initial administrator provisioning
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}


# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Application document upload limit
app.storage.max-file-size-bytes=10485760

# AWS Configuration
app.aws.region=ap-south-1

# S3 Configuration
app.storage.s3.bucket=evidence-vault-primary-263554

# Keep local storage active until S3 integration is verified
app.storage.provider=s3

