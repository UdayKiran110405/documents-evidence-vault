services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evidence-vault-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  verifier:
    build:
      context: ./verifier
      dockerfile: Dockerfile
    container_name: evidence-vault-verifier
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./verifier/manifests:/app/manifests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s