
services:

  # ---------------- MYSQL DATABASE ----------------
  mysql:
    image: mysql:8.4
    container_name: evidence-vault-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- SPRING BOOT BACKEND ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: evidence-vault-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_URL: jdbc:mysql://mysql:3306/evidence_vault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      AWS_PROFILE: ${AWS_PROFILE:-evidence-vault}
      AWS_REGION: ap-south-1

    ports:
      - "8081:8081"

    volumes:
      - type: bind
        source: ${USERPROFILE}/.aws
        target: /root/.aws
        read_only: true

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8081/actuator/health || exit 1
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------- PYTHON VERIFICATION SERVICE ----------------
  verifier:
    build:
      context: ./verifier
      dockerfile: Dockerfile

    container_name: evidence-vault-verifier
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      AWS_PROFILE: ${AWS_PROFILE:-evidence-vault}
      AWS_DEFAULT_REGION: ap-south-1

    ports:
      - "8090:8090"

    volumes:
      - ./verifier/manifests:/app/manifests

      - type: bind
        source: ${USERPROFILE}/.aws
        target: /root/.aws
        read_only: true

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

# ---------------- PERSISTENT STORAGE ----------------
volumes:
  mysql_data:
