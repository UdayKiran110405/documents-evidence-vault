name: Build & Deploy EvidenceVault to AWS EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Spring Boot Backend
        working-directory: ./backend
        run: ./mvnw clean test-compile -B

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python Verifier Syntax & Dependencies
        working-directory: ./verifier
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py storage.py recovery.py metrics.py manifests.py etl_to_snowflake.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build React Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy-to-ec2:
    name: Deploy to AWS EC2 (ap-south-1)
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH via appleboy/ssh-action
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/documents-evidence-vault
            git pull origin main

            cd ~/documents-evidence-vault/frontend
            npm install
            npm run build
            sudo rm -rf /var/www/evidence-vault/*
            sudo cp -r dist/* /var/www/evidence-vault/

            cd ~/documents-evidence-vault
            docker compose -f compose.prod.yaml up -d --build
            docker compose -f compose.prod.yaml ps