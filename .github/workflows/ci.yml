
name: Document Evidence Vault CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Spring Boot backend
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install -r verifier/requirements.txt

      - name: Validate Python source
        run: python -m compileall -q verifier

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: document-evidence-vault-backend:ci

      - name: Build verifier Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./verifier
          file: ./verifier/Dockerfile
          push: false
          tags: document-evidence-vault-verifier:ci
